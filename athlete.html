<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OSL Training">
<link rel="manifest" href="athlete.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<title>OSL-Coaching · Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0b0d10; --bg2:#101318; --card:#14181e; --card2:#1a1f27; --line:#232a33; --line2:#2d3540;
  --text:#eef1f4; --text2:#a9b1bc; --muted:#6c7581;
  --accent:#c8f560; --accent-ink:#0b0d10; --accent-soft:rgba(200,245,96,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --warn:#e66767; --ok:#199e70;
  --r:14px; --r2:10px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(200,245,96,.06),transparent 60%),var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-columns:248px 1fr}
button,input,select,textarea{font:inherit;color:inherit}
/* Sidebar */
aside{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;flex:none}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 6px}
.ath{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.ath:hover{background:var(--card)}
.ath.on{background:var(--card2);border-color:var(--line2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--card2);color:var(--accent);border:1px solid var(--line2);flex:none}
.ath .nm{font-weight:500;line-height:1.2}.ath .id{font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
/* Buttons & Inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--text2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{width:76px}
button,a,.click,input,select,textarea{touch-action:manipulation}
@media (max-width:820px){input,select,textarea{font-size:16px}}
input[type=date]{color-scheme:dark}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
/* Layout */
main{padding:24px 32px 48px;min-width:0}
@supports (padding:env(safe-area-inset-top)){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
header.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--text2)}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.status.err{color:var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.side-main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.muted{color:var(--muted)}.t2{color:var(--text2)}.err{color:var(--warn)}
.small{font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--text2);font-weight:500;margin-left:3px}
.kpi .d{font-size:12px;color:var(--text2);margin-top:2px}
/* Tables */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{overflow:auto}
.tbl-wrap.tall{max-height:460px}
.tbl-wrap.tall th{position:sticky;top:0;background:var(--card)}
.g-home{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.g-home{grid-template-columns:minmax(0,1fr)}}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);color:var(--text2);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
/* Calendar */
.calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}
.range-label{font-weight:600;margin:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 150px;gap:6px}
.cal .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 2px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:5px}
.cal.tall .day{min-height:220px}
.day.past{background:var(--bg2)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.day .dh b{color:var(--text2);font-weight:600}
.day.today .dh b{color:var(--accent)}
.day .add{opacity:0;border:0;background:var(--card2);color:var(--accent);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.day:hover .add{opacity:1}
.ev{border-radius:8px;padding:6px 8px;font-size:12px;background:var(--card2);border:1px solid var(--line2);position:relative;line-height:1.35}
.ev .t{display:flex;align-items:center;gap:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:14px}
.ev .m{color:var(--text2)}
.ev.plan{border-style:dashed;background:transparent}
.ev.race{border:1px solid var(--accent);background:var(--accent-soft)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.team-card:hover{border-color:var(--line2)}
.day.drop{border-color:var(--accent);background:var(--accent-soft)}
[data-drag]{cursor:grab}
.wk .btn{padding:3px 7px;font-size:11px}
.prio{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}
.day .addr{opacity:0;border:0;background:var(--card2);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1}
.day:hover .addr{opacity:1}
.ev.plan.done{opacity:.45}
a.btn{text-decoration:none;color:inherit}
.click{cursor:pointer;-webkit-tap-highlight-color:rgba(200,245,96,.15)}
.ev.click:hover{border-color:var(--text2)}
tr.click:hover td{background:rgba(200,245,96,.05)}
dialog.wide{max-width:980px;max-height:92vh}
.ev .x{position:absolute;right:4px;top:3px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.ev .x:hover{color:var(--warn)}
.ev .tss{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.wk{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.wk .r{display:flex;justify-content:space-between;gap:6px}
.wk .r span:first-child{color:var(--muted)}
.wk b{font-variant-numeric:tabular-nums;font-weight:600}
/* Builder */
.sport-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.lib-item{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border:1px solid transparent}
.lib-item:hover{background:var(--card2)}
.lib-item.on{background:var(--card2);border-color:var(--line2)}
.lib-item small{color:var(--muted)}
.block{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg2)}
.block .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step .pv{color:var(--text2);font-size:12px;flex:1;min-width:90px;font-variant-numeric:tabular-nums}
.step select,.step input{padding:6px 7px}
.icon-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.icon-x:hover{color:var(--warn)}
.profile{display:flex;height:56px;align-items:flex-end;gap:2px;margin:4px 0 8px}
.profile div{border-radius:3px 3px 0 0;min-width:2px}
pre{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;margin:0;color:var(--text2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap;display:none;z-index:5}
.tip b{display:block;margin-bottom:4px;color:var(--text)}
.tip .tr{display:flex;align-items:center;gap:6px;color:var(--text2)}
.tip .tr strong{color:var(--text);margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
/* Dialog */
dialog{border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:18px;padding:24px;max-width:600px;width:94vw;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,8,.7);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 6px;font-size:18px}
ol.steps{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:6px;color:var(--text2)}
ol.steps b{color:var(--text)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.side-main{grid-template-columns:1fr}}
/* Tablet (z.B. iPad hochkant): Seitenleiste nach oben, Kalender ohne eigene Wochenspalte */
@media (max-width:1100px){
  body{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);gap:8px}
  .brand{padding:0 6px 0 0}.side-h{display:none}
  #athletes{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  .ath .id{display:none}.ath{padding:5px 8px}
  .side-foot{margin:0;flex-direction:row;border:0;padding:0;width:100%;flex-wrap:wrap}
  main{padding:18px 20px 40px}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .hd:nth-child(8){display:none}
  .wk{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:4px 16px;padding:8px 12px}
  .wk .r{gap:6px}
  .day{padding:6px;min-height:96px}.ev{padding:5px 6px;font-size:11px}.ev .tss .pill{font-size:10px;padding:1px 5px}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr)}
  .tabs{overflow-x:auto;max-width:100%}
  header.top{gap:10px}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 0}.side-h{display:none}
  #athletes{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  .ath .id{display:none}.ath{padding:5px 8px}
  .side-foot{margin:0;flex-direction:row;border:0;padding:0;width:100%}
  main{padding:16px}
  .g2,.g3,.side-main{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{grid-template-columns:1fr}.cal .hd{display:none}
  .day{min-height:0}.day.past.empty-day{display:none}.day .add{opacity:1}
  .wk{flex-direction:row;flex-wrap:wrap;margin-bottom:10px}
}

/* ---- Athleten-App ---- */
body{display:block;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 24px}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 4px;max-width:760px;margin:0 auto}
.topbar .brand{padding:0;font-size:15px}
.topbar .brand .logo{width:30px;height:30px}
.topbar .who{margin-left:auto;color:var(--text2);font-size:13px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:rgba(16,19,24,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.bottomnav button{flex:1;max-width:180px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px;border-radius:10px;cursor:pointer}
.bottomnav button span{font-size:20px;line-height:1}
.bottomnav button.on{color:var(--accent);background:var(--accent-soft)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.race-banner{display:flex;align-items:center;gap:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.race-banner .big{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.wcard{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;margin-bottom:10px}
.wcard:hover{border-color:var(--line2)}
.wcard .nm{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.wcard .meta{color:var(--text2);margin-top:4px}
.dayrow{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.dayrow .dd{color:var(--muted);font-size:12px;line-height:1.3}
.dayrow .dd b{display:block;color:var(--text2);font-size:16px}
.dayrow.today .dd b{color:var(--accent)}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;flex-wrap:wrap}
.item:hover{background:var(--card)}
.item .t{font-weight:600}
.item .m{color:var(--text2);font-size:12px;width:100%;padding-left:15px}
.rest{color:var(--muted);font-size:13px;padding:6px 8px}
.steps{display:flex;flex-direction:column;gap:8px}
.sblock{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.sblock .sh{padding:8px 12px;background:var(--card2);font-weight:600;display:flex;justify-content:space-between}
.srow{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.srow:first-of-type{border-top:0}
.srow .du{font-weight:600;font-variant-numeric:tabular-nums}
.srow .tg{font-variant-numeric:tabular-nums}
.srow .zn{font-size:12px;color:var(--muted)}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--text2);cursor:pointer}
.rpe button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.feel button{width:auto;padding:0 10px}
/* erledigt */
.check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#06110c;font-size:13px;font-weight:700;flex:none}
.wcard.done{border-color:rgba(25,158,112,.55);background:linear-gradient(180deg,rgba(25,158,112,.12),var(--bg2))}
.item.done .t{color:var(--text2)}
.item .m{padding-left:15px}
.item.done .m{padding-left:30px}
#dlgBody>.row:first-child{position:sticky;top:-24px;z-index:3;background:var(--card);margin:-24px -24px 0;padding:18px 24px 10px;border-bottom:1px solid var(--line)}
.kpis .kpi .v{overflow-wrap:anywhere}
dialog.full{max-width:760px;width:100vw;max-height:100dvh;border-radius:18px}
@media (max-width:640px){
  dialog.full{border-radius:0;height:100dvh;max-height:100dvh;margin:0;max-width:100vw;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
  #dlgBody>.row:first-child{top:-16px;margin:-16px -14px 0;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
  .wrap{padding:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #dlg .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  #dlg .kpi{padding:8px 10px!important}#dlg .kpi .v{font-size:15px!important}#dlg .kpi .l{font-size:11px}
  .srow{grid-template-columns:72px 1fr}
  .card{padding:14px}
}
</style>

<body>

function zoneName(sport, st, set) {
  const cfg = set?.[sport === 'Swim' ? 'Swim' : 'Run'], z = cfg?.pace_zones, names = cfg?.pace_zone_names; if (!z || sport === 'Ride') return '';
  const m = st.mode || 'pct'; if (m === 'zone') return '';
  if (m === 'hrz' || m === 'lthr') return 'nach Herzfrequenz';
  const f = factor(sport, st, set) * 100; let i = z.findIndex(u => f <= u); if (i < 0) i = z.length - 1;

}
// Ziel immer als Pace (bzw. Puls/Watt), nie als Prozent

  if ((st.mode || 'pct') === 'abs') { const [x, y] = st.ramp ? [st.pSlow, st.pFast] : [Math.min(st.pSlow, st.pFast), Math.max(st.pSlow, st.pFast)];
    return `${mmss(x)}${x !== y ? '–' + mmss(y) : ''} ${unit}`; }

}

    <h2 class="sec">Laufstil (Stryd)</h2><div id="anaEco"></div>
    <h2 class="sec">Leistungskurve</h2><div class="card tbl-wrap" id="anaPc"><span class="spin"></span></div>`;
  chart($('#anaFit'), [{ name: 'Fitness', color: 'var(--s1)', pts: wl.map(x => ({ x: parseYmd(x.id), y: x.ctl })) }, { name: 'Ermüdung', color: 'var(--s2)', pts: wl.map(x => ({ x: parseYmd(x.id), y: x.atl })) }], { yfmt: n0 });
  for (const [el, k, c] of [['#anaEfP', 'efPace', 'var(--s3)'], ['#anaEfW', 'efW', 'var(--s1)']]) { const rs = runs.filter(r => r[k]);
    chart($(el), [{ name: 'Einzelner Lauf', color: c, scatter: true, pts: rs.map(r => ({ x: r.date, y: r[k], label: r.name })) }, { name: 'Ø 5 Läufe', color: c, pts: roll(rs, k) }], { yfmt: n2, empty: 'Keine Daten im Zeitraum.' }); }
  ecoCards($('#anaEco'), acts, 'stack');
  powerCurveHtml(id).then(h => { if ($('#anaPc')) $('#anaPc').innerHTML = h; });
}

// ---------- Profil ----------
async function renderProf() {
  loading();
  const id = S.me.id, today = new Date();
  let set, well, races;
  try { [set, well, races] = await Promise.all([sportSettings(id, true), iv('GET', `athlete/${id}/wellness?oldest=${ymd(addDays(today, -3))}&newest=${ymd(today)}`), events(id, ymd(today), ymd(addDays(today, 365)))]); }
  catch (e) { $('#view').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  const R = set.Run || {}, thr = R.threshold_pace, w = [...(well || [])].reverse().find(x => x.ctl != null) || {}, v = thr ? vo2(thr * 60) / 0.88 : null;
  const zr = (z, i, f) => { const lo = i ? z[i - 1] : 0, up = z[i]; return up >= 999 ? `< ${f(lo)}` : lo ? `${f(up)}–${f(lo)}` : `> ${f(up)}`; };
  let h = `<div class="kpis" style="margin-top:6px">
    <div class="kpi"><div class="l">Fitness</div><div class="v">${n0(w.ctl)}</div><div class="d">Form ${formTxt(w.ctl - w.atl)}</div></div>
    <div class="kpi"><div class="l">Schwellenpace</div><div class="v">${fmtPace(thr)}<small>/km</small></div><div class="d">${v ? 'VDOT ≈ ' + v.toFixed(1) : ''}</div></div>
    <div class="kpi"><div class="l">Schwellenpuls</div><div class="v">${R.lthr || '–'}<small>bpm</small></div><div class="d">max ${R.max_hr || '–'}</div></div></div>`;
  if (thr && R.pace_zones) h += `<h2 class="sec">Pace-Zonen</h2><div class="card"><table>${R.pace_zones.map((u, i) => `<tr><td>${esc(R.pace_zone_names?.[i] || 'Z' + (i + 1))}</td><td class="num">${zr(R.pace_zones, i, p => fmtPace(thr * p / 100))} /km</td></tr>`).join('')}</table></div>`;
  if (R.hr_zones) h += `<h2 class="sec">Puls-Zonen</h2><div class="card"><table>${R.hr_zones.map((u, i) => `<tr><td>${esc(R.hr_zone_names?.[i] || 'Z' + (i + 1))}</td><td class="num">${i ? R.hr_zones[i - 1] + 1 : 0}–${u} bpm</td></tr>`).join('')}</table></div>`;
  if (v) h += `<h2 class="sec">Prognosen aus deiner Schwelle</h2><div class="card"><table>${[[5000, '5 km'], [10000, '10 km'], [21097.5, 'Halbmarathon'], [42195, 'Marathon']].map(([d, n]) => { const t = predict(v, d); return `<tr><td>${n}</td><td class="num">${fmtDur(t)}</td><td class="num">${fmtPace(d / t)}/km</td></tr>`; }).join('')}</table></div>`;
  const rs = (races || []).filter(isRace).sort((a, b) => a.start_date_local.localeCompare(b.start_date_local));
  if (rs.length) h += `<h2 class="sec">Wettkämpfe</h2>${rs.map(r => `<div class="item click" data-ev="${r.id}"><span class="prio">${raceInfo(r).prio}</span><span class="t">${esc(r.name)}</span><span class="m">${dLong(parseYmd(r.start_date_local))}${r.distance ? ' · ' + km(r.distance) + ' km' : ''}${raceInfo(r).goal ? ' · Ziel ' + fmtDur(raceInfo(r).goal) : ''}</span></div>`).join('')}`;
  h += `<div style="text-align:center;margin-top:24px"><button class="btn danger" id="logout">Abmelden</button></div>`;
  $('#view').innerHTML = h;
  $('#logout').onclick = () => { if (confirm('Von diesem Gerät abmelden?')) { LS.del('key'); location.reload(); } };
}

// Updates: beim Zurückkehren in die App nach neuer Version suchen und dann neu laden
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !navigator.serviceWorker.controller) return; reloaded = true; if (!document.querySelector('dialog[open]')) location.reload(); });
}
init();
</script>
