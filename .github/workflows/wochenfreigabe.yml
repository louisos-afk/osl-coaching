name: Wochenfreigabe

# Jeden Sonntagabend: Athleten bekommen die neue Woche. Sichtbar ist immer nur die laufende Woche.
on:
  schedule:
    - cron: "7 17 * * 0"   # Sonntag 17:07 UTC (18:07 Winterzeit, 19:07 Sommerzeit)
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sichtbarkeit abgleichen
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python3 scripts/release.py
      # GitHub pausiert Zeitplaene nach 60 Tagen ohne Repo-Aktivitaet; das haelt den Workflow aktiv.
      - name: Zeitplan aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wochenfreigabe.yml/enable"
