<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OSL-Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --bg2:#101318; --card:#14181e; --card2:#1a1f27; --line:#232a33; --line2:#2d3540;
  --text:#eef1f4; --text2:#a9b1bc; --muted:#6c7581;
  --accent:#c8f560; --accent-ink:#0b0d10; --accent-soft:rgba(200,245,96,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --warn:#e66767; --ok:#199e70;
  --r:14px; --r2:10px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(200,245,96,.06),transparent 60%),var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-columns:248px 1fr}
button,input,select,textarea{font:inherit;color:inherit}
/* Sidebar */
aside{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 6px}
.ath{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.ath:hover{background:var(--card)}
.ath.on{background:var(--card2);border-color:var(--line2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--card2);color:var(--accent);border:1px solid var(--line2);flex:none}
.ath .nm{font-weight:500;line-height:1.2}.ath .id{font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
/* Buttons & Inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--text2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{width:76px}
input[type=date]{color-scheme:dark}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
/* Layout */
main{padding:24px 32px 48px;min-width:0}
header.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--text2)}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.status.err{color:var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.side-main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.muted{color:var(--muted)}.t2{color:var(--text2)}.err{color:var(--warn)}
.small{font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--text2);font-weight:500;margin-left:3px}
.kpi .d{font-size:12px;color:var(--text2);margin-top:2px}
/* Tables */
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{overflow:auto}
.tbl-wrap.tall{max-height:460px}
.tbl-wrap.tall th{position:sticky;top:0;background:var(--card)}
.g-home{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.g-home{grid-template-columns:minmax(0,1fr)}}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);color:var(--text2);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
/* Calendar */
.calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}
.range-label{font-weight:600;margin:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 150px;gap:6px}
.cal .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 2px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:5px}
.cal.tall .day{min-height:220px}
.day.past{background:var(--bg2)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.day .dh b{color:var(--text2);font-weight:600}
.day.today .dh b{color:var(--accent)}
.day .add{opacity:0;border:0;background:var(--card2);color:var(--accent);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.day:hover .add{opacity:1}
.ev{border-radius:8px;padding:6px 8px;font-size:12px;background:var(--card2);border:1px solid var(--line2);position:relative;line-height:1.35}
.ev .t{display:flex;align-items:center;gap:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:14px}
.ev .m{color:var(--text2)}
.ev.plan{border-style:dashed;background:transparent}
.ev.race{border:1px solid var(--accent);background:var(--accent-soft)}
.prio{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}
.day .addr{opacity:0;border:0;background:var(--card2);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1}
.day:hover .addr{opacity:1}
.ev.plan.done{opacity:.45}
a.btn{text-decoration:none;color:inherit}
.click{cursor:pointer}
.ev.click:hover{border-color:var(--text2)}
tr.click:hover td{background:rgba(200,245,96,.05)}
dialog.wide{max-width:980px;max-height:92vh}
.ev .x{position:absolute;right:4px;top:3px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.ev .x:hover{color:var(--warn)}
.ev .tss{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.wk{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.wk .r{display:flex;justify-content:space-between;gap:6px}
.wk .r span:first-child{color:var(--muted)}
.wk b{font-variant-numeric:tabular-nums;font-weight:600}
/* Builder */
.sport-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.lib-item{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border:1px solid transparent}
.lib-item:hover{background:var(--card2)}
.lib-item.on{background:var(--card2);border-color:var(--line2)}
.lib-item small{color:var(--muted)}
.block{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg2)}
.block .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step .pv{color:var(--text2);font-size:12px;flex:1;min-width:90px;font-variant-numeric:tabular-nums}
.step select,.step input{padding:6px 7px}
.icon-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.icon-x:hover{color:var(--warn)}
.profile{display:flex;height:56px;align-items:flex-end;gap:2px;margin:4px 0 8px}
.profile div{border-radius:3px 3px 0 0;min-width:2px}
pre{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;margin:0;color:var(--text2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap;display:none;z-index:5}
.tip b{display:block;margin-bottom:4px;color:var(--text)}
.tip .tr{display:flex;align-items:center;gap:6px;color:var(--text2)}
.tip .tr strong{color:var(--text);margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
/* Dialog */
dialog{border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:18px;padding:24px;max-width:600px;width:94vw;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,8,.7);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 6px;font-size:18px}
ol.steps{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:6px;color:var(--text2)}
ol.steps b{color:var(--text)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.side-main{grid-template-columns:1fr}}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr)}
  .tabs{overflow-x:auto;max-width:100%}
  header.top{gap:10px}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 0}.side-h{display:none}
  #athletes{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  .ath .id{display:none}.ath{padding:5px 8px}
  .side-foot{margin:0;flex-direction:row;border:0;padding:0;width:100%}
  main{padding:16px}
  .g2,.g3,.side-main{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{grid-template-columns:1fr}.cal .hd{display:none}
  .day{min-height:0}.day.past.empty-day{display:none}.day .add{opacity:1}
  .wk{flex-direction:row;flex-wrap:wrap;margin-bottom:10px}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><i>◆</i>OSL-Coaching</div>
  <div class="side-h">Athleten</div>
  <div id="athletes"></div>
  <button class="btn" id="btnAddAth" style="justify-content:center;margin-top:6px">+ Athlet hinzufügen</button>
  <div class="side-foot">
    <button class="btn ghost sm" id="btnRefresh">↻ Liste aktualisieren</button>
    <button class="btn ghost sm" id="btnKey">⚙ Einstellungen</button>
    <div class="small muted" id="coachName" style="padding:4px 8px"></div>
  </div>
</aside>
<main>
  <header class="top">
    <div><h1 id="title">OSL-Coaching</h1><div class="sub" id="subtitle"></div></div>
    <nav class="tabs" id="tabs">
      <button data-v="home">Übersicht</button><button data-v="cal">Kalender</button><button data-v="lib">Workouts</button>
      <button data-v="ana">Analyse</button><button data-v="thr">Schwellen</button>
    </nav>
    <span class="status" id="status"></span>
  </header>
  <section id="view"></section>
</main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
'use strict';
// =============== Basis ===============
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('coach.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('coach.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('coach.' + k); } catch {} },
};
const S = { me: null, athletes: [], cur: LS.get('cur'), view: LS.get('view', 'home'), lib: [], folderId: null, sel: null, libSport: 'Run',
  settings: {}, actIndex: {}, evIndex: {}, cal: { start: null, weeks: LS.get('calWeeks', 4) }, range: LS.get('range', { preset: '3M' }), actCache: {} };
function status(msg, err) { const el = $('#status'); el.innerHTML = msg || ''; el.className = 'status' + (err ? ' err' : ''); }

async function iv(method, path, body) {
  const key = LS.get('key', '');
  if (!key) throw new Error('Kein API-Key gesetzt');
  const r = await fetch('https://intervals.icu/api/v1/' + path, { method,
    headers: Object.assign({ Authorization: 'Basic ' + btoa('API_KEY:' + key), Accept: 'application/json' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j; try { j = t ? JSON.parse(t) : null; } catch { j = t; }
  if (r.status === 401 || r.status === 403) throw new Error(`Zugriff verweigert (${r.status}). API-Key oder Coach-Freigabe prüfen.`);
  if (!r.ok) throw new Error((j && j.error) || (typeof j === 'string' ? j.slice(0, 200) : '') || 'HTTP ' + r.status);
  return j;
}
async function pool(items, n, fn) { const q = [...items]; await Promise.all(Array.from({ length: n }, async () => { while (q.length) await fn(q.shift()); })); }

// =============== Zeit, Zahlen ===============
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
// Sichtbarkeit: Athlet sieht alles bis Sonntag in 14 Tagen ab dem letzten Sonntag (Freigabe jeden Sonntag)
function horizon(d = new Date()) { const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(addDays(t, -t.getDay()), 14); }
const hiddenFor = date => parseYmd(date) > horizon();
async function syncVisibility() {
  const today = ymd(new Date()), out = [];
  for (const a of S.athletes) {
    const evs = await iv('GET', `athlete/${a.id}/events?oldest=${today}&newest=${ymd(addDays(new Date(), 400))}`); let sh = 0, hd = 0;
    for (const e of evs || []) { if (e.category !== 'WORKOUT') continue; const want = hiddenFor(e.start_date_local);
      if (!!e.hide_from_athlete !== want) { await iv('PUT', `athlete/${a.id}/events/${e.id}`, { hide_from_athlete: want }); want ? hd++ : sh++; } }
    out.push(`${a.name}: ${sh} freigegeben, ${hd} versteckt`);
  }
  return out;
}
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const dShort = d => `${d.getDate()}. ${MON[d.getMonth()]}`;
const dLong = d => `${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`;
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
function fmtH(s) { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${pad(m % 60)}` : `${m} min`; }
function fmtPace(ms, per = 1000) { if (!ms || ms <= 0 || !isFinite(ms)) return '–'; const s = Math.round(per / ms); return `${Math.floor(s / 60)}:${pad(s % 60)}`; }
function parseTime(str) { const p = String(str).trim().split(':').map(Number); if (!str || p.some(isNaN)) return NaN; return p.reduce((a, v) => a * 60 + v, 0); }
const km = m => (m / 1000).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n0 = v => v == null || !isFinite(v) ? '–' : Math.round(v).toLocaleString('de-DE');
const n2 = v => v == null || !isFinite(v) ? '–' : v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// =============== VDOT (Daniels/Gilbert) ===============
const vo2 = v => -4.6 + 0.182258 * v + 0.000104 * v * v;
const pctMax = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
const vdotOf = (d, s) => { const t = s / 60; return vo2(d / t) / pctMax(t); };
function predict(v, d) { let lo = d / 1000 * 60, hi = d / 1000 * 600; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; vdotOf(d, m) > v ? lo = m : hi = m; } return (lo + hi) / 2; }
function speedAt(v, f) { const c = -4.6 - f * v; return (-0.182258 + Math.sqrt(0.182258 ** 2 - 4 * 0.000104 * c)) / (2 * 0.000104) / 60; }
const DISTS = [[1500, '1500 m'], [1609.34, 'Meile'], [3000, '3000 m'], [5000, '5 km'], [10000, '10 km'], [21097.5, 'Halbmarathon'], [42195, 'Marathon']];

// =============== Sportarten & Workouts ===============
const SPORTS = {
  Run: { label: 'Laufen', icon: '🏃', color: 'var(--s3)', units: { m: 'min', s: 's', km: 'km', mtr: 'm' }, suffix: ' Pace', tgt: '% Schwellenpace',

// =============== Metriken: TSS Watt / HR / Pace, Effizienz ===============
// Fehlt intervals.icu die Leistungsauswertung (z.B. weil keine Lauf-FTP gesetzt war), wird NP aus dem Watt-Stream berechnet.
function hasWatts(a) { return a.device_watts || (a.stream_types || []).includes('watts'); }
function cachedPower(a) { if (a.icu_weighted_avg_watts) return { np: a.icu_weighted_avg_watts, avg: a.icu_average_watts }; return LS.get('pw.' + a.id, null); }
async function ensurePower(acts, onProgress) {
  const need = acts.filter(a => ['Run', 'Ride', 'VirtualRide', 'TrailRun'].includes(a.type) && hasWatts(a) && !cachedPower(a) && a.moving_time > 300);
  let done = 0;
  await pool(need, 4, async a => {
    try {
      const st = await iv('GET', `activity/${a.id}/streams?types=watts`);
      const w = ((st || []).find(x => x.type === 'watts')?.data || []).map(v => v || 0);
      if (w.length > 30) {
        let sum = 0, roll = [], acc = 0, p4 = 0, n = 0;
        for (let i = 0; i < w.length; i++) { sum += w[i]; acc += w[i]; roll.push(w[i]); if (roll.length > 30) acc -= roll.shift(); if (i >= 29) { p4 += (acc / 30) ** 4; n++; } }
        const avg = sum / w.length, np = n ? (p4 / n) ** 0.25 : avg;
        if (avg > 20) LS.set('pw.' + a.id, { np, avg }); else LS.set('pw.' + a.id, { np: null, avg: null });
      } else LS.set('pw.' + a.id, { np: null, avg: null });
    } catch {}
    done++; onProgress && onProgress(done, need.length);
  });
}
function metrics(a, set) {
  const sport = sportOf(a.type), ftp = sport === 'Ride' ? set?.Ride?.ftp : set?.Run?.ftp;
  const pw = cachedPower(a), sec = a.moving_time || 0, hr = a.average_heartrate || null;
  let pTSS = a.power_load ?? null;
  if (pTSS == null && pw?.np && ftp) pTSS = sec * pw.np * (pw.np / ftp) / (ftp * 3600) * 100;
  const speed = a.distance && sec ? a.distance / sec : null;
  return { sport, sec, dist: a.distance || 0, hr, np: pw?.np || null, avgW: pw?.avg || null, pTSS, hTSS: a.hr_load ?? null, paceTSS: a.pace_load ?? null,
    efW: pw?.np && hr ? pw.np / hr : null, efPace: speed && hr ? speed * 60 / hr : null, speed, load: a.icu_training_load ?? null };
}

// Zieltyp wechseln, Werte sinnvoll vorbelegen
function switchMode(st, m) {
  st.mode = m;
  if (m === 'abs' && !st.pSlow) { st.pSlow = 300; st.pFast = 290; }
  if ((m === 'zone' || m === 'hrz') && !st.z1) { st.z1 = 2; st.z2 = 2; }
  if (m === 'lthr' && (st.lo == null || st.lo > 110)) { st.lo = 85; st.hi = 90; }
  if (m === 'pct' && st.lo == null) { st.lo = 75; st.hi = 85; }
}

// =============== Detail: absolvierte Einheit ===============
function downsample(time, vals, n = 400, smooth = 0) {
  if (!vals) return [];
  let v = vals.map(x => x == null ? null : +x);
  if (smooth) { const out = []; let acc = 0, q = []; for (const x of v) { q.push(x || 0); acc += x || 0; if (q.length > smooth) acc -= q.shift(); out.push(acc / q.length); } v = out; }
  const step = Math.max(1, Math.floor(v.length / n)), pts = [];
  for (let i = 0; i < v.length; i += step) { const sl = v.slice(i, i + step).filter(x => x != null); if (sl.length) pts.push({ x: time ? time[i] : i, y: sl.reduce((s, x) => s + x, 0) / sl.length }); }
  return pts;
}

const PRESETS_R = [['4W', 28], ['3M', 91], ['6M', 182], ['1J', 365], ['2J', 730]];

function rangeDates() { const r = S.range; return r.preset ? presetDates(r.preset) : [r.from, r.to]; }
// Jede Karte kann einen eigenen Zeitraum haben; ohne Angabe gilt der obere Zeitraum.
const CARDS = { load: 'Trainingsbelastung pro Woche', fit: 'Fitness und Ermüdung', efW: 'Effizienz Leistung · Watt pro Herzschlag (NP / Ø HF)', efP: 'Effizienz Pace · Meter pro Herzschlag', tbl: 'Einheiten im Zeitraum' };
function cardDates(k) { const c = LS.get('cardRange', {})[k]; if (!c) return rangeDates(); return c.preset ? presetDates(c.preset) : [c.from, c.to]; }
function setCardRange(k, v) { const all = LS.get('cardRange', {}); if (v) all[k] = v; else delete all[k]; LS.set('cardRange', all); }
function cardHead(k) {

      <option value="custom" ${val === 'custom' ? 'selected' : ''}>Eigener …</option></select>
    ${val === 'custom' ? `<input type="date" class="crf" data-k="${k}" value="${f}" style="padding:4px 6px;font-size:12px"><input type="date" class="crt" data-k="${k}" value="${t}" style="padding:4px 6px;font-size:12px">`

}

    ${!set.Run?.ftp ? `<div class="card" style="margin-bottom:16px;border-color:var(--s2)">Für TSS aus Watt fehlt die Lauf-CP (FTP). <button class="btn sm" id="toThr">Unter Schwellen eintragen</button></div>` : ''}
    <div class="g2">${['load', 'fit', 'efW', 'efP'].map(k => `<div class="card">${cardHead(k)}<div id="ch-${k}"></div></div>`).join('')}</div>

// Liniendiagramm mit Hover (eine y-Achse)
function chart(el, series, o = {}) {
  const all = series.flatMap(s => s.pts.filter(p => p.y != null));
  if (!all.length) { el.innerHTML = `<div class="muted small" style="padding:30px 0;text-align:center">${o.empty || 'Keine Daten im Zeitraum.'}</div>`; return; }
  const Wd = o.w || 560, H = o.h || 220, L = 40, R = 12, T = 10, B = 26;
  const xs = all.map(p => +p.x), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let y0 = Math.min(...all.map(p => p.y)), y1 = Math.max(...all.map(p => p.y)); if (o.dots || y0 > 0 && y0 / y1 < 0.5) y0 = Math.min(0, y0);
  const pad = (y1 - y0) * 0.08 || 1; y1 += pad; if (y0 !== 0) y0 -= pad;
  const X = v => L + (x1 === x0 ? (Wd - L - R) / 2 : (v - x0) / (x1 - x0) * (Wd - L - R)), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = 4, yt = Array.from({ length: ticks + 1 }, (_, i) => y0 + (y1 - y0) * i / ticks);
  const xt = Array.from({ length: 4 }, (_, i) => x0 + (x1 - x0) * i / 3);
  const lines = series.filter(s => !s.scatter).map(s => { const p = s.pts.filter(q => q.y != null); return `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q => X(+q.x).toFixed(1) + ',' + Y(q.y).toFixed(1)).join(' ')}"/>${o.dots ? p.map(q => `<circle cx="${X(+q.x)}" cy="${Y(q.y)}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`).join('') : ''}`; }).join('');
  const dots = series.filter(s => s.scatter).map(s => s.pts.map(q => `<circle cx="${X(+q.x)}" cy="${Y(q.y)}" r="4" fill="${s.color}" fill-opacity=".35" stroke="${s.color}" stroke-width="1"/>`).join('')).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color};${s.scatter ? 'width:8px;height:8px;border-radius:50%;opacity:.6' : ''}"></i>${s.name}</span>`).join('')}</div>` : '';
  el.innerHTML = `${legend}<div class="chart"><svg viewBox="0 0 ${Wd} ${H}">
    ${yt.map(v => `<line class="gridl" x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${(o.yfmt || n0)(v)}</text>`).join('')}
    ${xt.map(v => `<text x="${X(v)}" y="${H - 6}" text-anchor="middle">${o.xnum ? fmtDur(v) : dShort(new Date(v))}</text>`).join('')}
    ${dots}${lines}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text2)" stroke-dasharray="3 3" visibility="hidden"/><g class="hl"></g>
    <rect x="${L}" y="${T}" width="${Wd - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>`;
  const svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), hl = $('.hl', el);
  const uniq = [...new Set(all.map(p => +p.x))].sort((a, b) => a - b);
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * Wd;
    let best = uniq[0]; for (const u of uniq) if (Math.abs(X(u) - sx) < Math.abs(X(best) - sx)) best = u;
    const rows = series.map(s => ({ s, p: s.pts.find(q => +q.x === best && q.y != null) })).filter(r => r.p);
    xh.setAttribute('x1', X(best)); xh.setAttribute('x2', X(best)); xh.setAttribute('visibility', 'visible');
    hl.innerHTML = rows.map(r => `<circle cx="${X(best)}" cy="${Y(r.p.y)}" r="5" fill="${r.s.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<b>${o.xnum ? fmtDur(best) : (o.xfmt || dLong)(new Date(best))}</b>${rows.map(r => `<div class="tr"><span class="dot" style="background:${r.s.color}"></span>${r.p.label ? esc(r.p.label) : r.s.name}<strong>${(o.yfmt || n0)(r.p.y)}</strong></div>`).join('')}`;
    tip.style.display = 'block'; const px = X(best) / Wd * r.width; tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
  };
  const hit = $('.hit', el); hit.onmousemove = move; hit.ontouchstart = e => move(e.touches[0]);
  hit.onmouseleave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); hl.innerHTML = ''; };
}

      ${Sw.id ? '' : '<div class="small muted">Keine Schwimm-Einstellungen im Account. In intervals.icu unter Einstellungen → Sport-Einstellungen anlegen.</div>'}</div></div>
    <div class="g2" style="margin-top:16px">
      <div class="card stack"><h3>VDOT aus Wettkampf</h3>
        <div class="row"><select id="vDist">${DISTS.map(([d, n]) => `<option value="${d}" ${race && race.d == d ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <input id="vTime" placeholder="h:mm:ss" value="${race ? fmtDur(race.t) : ''}" style="width:110px"><button class="btn" id="vCalc">Berechnen</button></div>
        <div id="vOut" class="t2 small">Wettkampfzeit eintragen. Die T-Pace kannst du als Schwellenpace übernehmen.</div></div>
      <div class="card" id="vTab"><h3>Prognosen und Trainingspaces</h3><div class="muted small">Erscheinen nach der Berechnung.</div></div></div>`;
  const put = async (type, body) => { const s = set[type]; try { await iv('PUT', `athlete/${a.id}/sport-settings/${s.id}`, body); status('Gespeichert'); S.actCache = {}; await sportSettings(a.id, true); } catch (e) { status(e.message, true); } };
  $$('[data-save]').forEach(b => b.onclick = () => {
    const t = b.dataset.save, num = id => { const v = $(id).value.trim(); return v ? +v : null; };
    if (t === 'Run') { const p = parseTime($('#rPace').value); if ($('#rPace').value && !p) return alert('Pace als m:ss eingeben.');
      put('Run', { threshold_pace: p ? 1000 / p : null, ftp: num('#rFtp'), lthr: num('#rLthr'), max_hr: num('#rMax') }); }
    if (t === 'Ride') put('Ride', { ftp: num('#bFtp'), lthr: num('#bLthr'), max_hr: num('#bMax') });
    if (t === 'Swim') { const p = parseTime($('#sPace').value); if (!p) return alert('Pace als m:ss eingeben.'); put('Swim', { threshold_pace: 100 / p }); }
  });
  const show = v => {
    const tP = speedAt(v, 0.88);
    $('#vOut').innerHTML = `<span style="font-size:28px;font-weight:600;color:var(--text)">VDOT ${v.toFixed(1)}</span> <button class="btn sm" id="vUse">T-Pace ${fmtPace(tP)}/km übernehmen</button>`;
    $('#vUse').onclick = () => { $('#rPace').value = fmtPace(tP); $('#rPace').focus(); status('T-Pace eingetragen, mit „Speichern“ bestätigen'); };
    const paces = [['Easy (E)', speedAt(v, 0.59), speedAt(v, 0.74)], ['Marathon (M)', 42195 / predict(v, 42195)], ['Schwelle (T)', tP], ['Intervall (I)', speedAt(v, 0.975)], ['Wiederholung (R)', 1609.34 / predict(v, 1609.34)]];
    $('#vTab').innerHTML = `<h3>Prognosen und Trainingspaces</h3><div class="g2"><table><tr><th>Strecke</th><th class="num">Zeit</th><th class="num">Pace</th></tr>${DISTS.map(([d, n]) => { const t = predict(v, d); return `<tr><td>${n}</td><td class="num">${fmtDur(t)}</td><td class="num">${fmtPace(d / t)}</td></tr>`; }).join('')}</table>
      <table><tr><th>Bereich</th><th class="num">Pace/km</th></tr>${paces.map(([n, x, y]) => `<tr><td>${n}</td><td class="num">${y ? fmtPace(y) + '–' + fmtPace(x) : fmtPace(x)}</td></tr>`).join('')}</table></div>
      <div class="small muted" style="margin-top:8px">Näherung nach Daniels/Gilbert.</div>`;
  };
  $('#vCalc').onclick = () => { const d = +$('#vDist').value, t = parseTime($('#vTime').value); if (!t) return alert('Zeit als h:mm:ss eingeben.'); const r = LS.get('races', {}); r[a.id] = { d, t }; LS.set('races', r); show(vdotOf(d, t)); };
  if (race) show(vdotOf(race.d, race.t));
}

// =============== Einstellungen ===============
function renderSettings() {
  const key = LS.get('key', '');
  $('#view').innerHTML = `<div class="g2">
    <div class="stack">
      <div class="card stack"><h3>Verbindung zu intervals.icu</h3>
        <div class="row"><span class="t2">API-Key:</span><code>${key ? '••••••••' + esc(key.slice(-4)) : '–'}</code></div>
        <div class="row"><button class="btn" id="setKey">Key ändern</button><button class="btn danger" id="delKey">Key aus diesem Browser löschen</button></div>
        <div class="small muted">Der Key liegt nur in diesem Browser. Auf jedem neuen Gerät einmal eingeben.</div></div>
      <div class="card stack"><h3>Wochenfreigabe</h3>
        <div class="t2">Athleten sehen geplante Workouts nur für die nächsten 2 Wochen. Jeden Sonntag wird die übernächste Woche freigegeben. Aktuell sichtbar bis <b>${dLong(horizon())}</b>.</div>
        <div class="row"><button class="btn" id="syncVis">Jetzt abgleichen</button><span class="small muted" id="syncRes"></span></div>
        <div class="small muted">Später geplante Workouts legt die App automatisch versteckt an. Einzelne Workouts kannst du im Workout-Dialog früher freigeben.</div></div>
      <div class="card"><h3>Konten</h3><table>
        <tr><th>Rolle</th><th>Name</th><th>Athleten-ID</th><th></th></tr>
        <tr><td>Coach</td><td>${esc(S.me?.name || '')}</td><td><code>${esc(S.me?.id || '')}</code></td><td><a class="btn sm" href="https://intervals.icu/settings" target="_blank" rel="noopener">Öffnen ↗</a></td></tr>
        ${S.athletes.map(x => `<tr><td>Athlet</td><td>${esc(x.name)}</td><td><code>${esc(x.id)}</code></td><td></td></tr>`).join('')}</table></div>
    </div>
    <div class="card stack"><h3>Notizen</h3>
      <textarea id="notes" rows="16" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:13px" placeholder="z.B. Login-E-Mails, Uhrenmodelle, Absprachen …">${esc(LS.get('notes', ''))}</textarea>
      <div class="row" style="justify-content:space-between"><span class="small muted" id="notesState">Wird automatisch in diesem Browser gespeichert.</span><button class="btn sm" id="notesCopy">Kopieren</button></div>
      <div class="small" style="color:var(--s2)">Hinweis: Notizen liegen unverschlüsselt im Browser. Passwörter besser in einen Passwort-Manager.</div></div></div>`;
  $('#setKey').onclick = () => keyDialog(false);
  $('#syncVis').onclick = async () => { $('#syncRes').innerHTML = '<span class="spin"></span>'; try { $('#syncRes').textContent = (await syncVisibility()).join(' · '); } catch (e) { $('#syncRes').textContent = e.message; } };
  $('#delKey').onclick = () => { if (confirm('API-Key aus diesem Browser löschen?')) { LS.del('key'); location.reload(); } };
  let t; $('#notes').oninput = e => { clearTimeout(t); t = setTimeout(() => { LS.set('notes', e.target.value); $('#notesState').textContent = 'Gespeichert ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }, 400); };
  $('#notesCopy').onclick = async () => { try { await navigator.clipboard.writeText($('#notes').value); $('#notesCopy').textContent = 'Kopiert ✓'; } catch {} };
}
